[project]
name = "airelibre_analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "polars",
    "duckdb",
    "plotly",
    "pandas",
    "dbt-duckdb",
    "pyyaml",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
#where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"